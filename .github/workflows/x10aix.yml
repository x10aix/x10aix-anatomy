name: x10aix modes and upstream integrity
on:
  push:
    branches: [x10aix]
  pull_request:
    branches: [x10aix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: x10aix
      - run: npm run check
        working-directory: x10aix
      - run: npm run build:video && node scripts/overlay.mjs && npm run build:web
        working-directory: x10aix
      - run: git diff --exit-code
